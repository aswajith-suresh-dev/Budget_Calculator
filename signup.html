<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Wallet | Sign Up</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-white">

    <main class="flex min-h-screen">

        <section class="relative hidden w-1/2 overflow-hidden bg-[#F1F5F9] md:flex md:flex-col md:justify-between md:p-8 lg:p-12">

            <a href="index.html" class="text-3xl font-semibold tracking-wide text-[#1E293B]">
                Smart<span class="text-[#2563EB]">Wallet</span>
            </a>

            <div class="flex flex-1 items-center justify-center">
                <img
                    src="./Finance app-cuate.svg"
                    alt="Smart Wallet financial illustration"
                    class="max-h-[60vh] w-full object-contain"
                >
            </div>

            <div class="max-w-md">
                <h2 class="text-2xl font-semibold leading-snug text-[#1E293B] lg:text-3xl">
                    Start your<br>financial journey.
                </h2>

                <p class="mt-3 text-sm leading-6 text-[#64748B]">
                    Create your account and take the first step toward
                    managing your money with confidence.
                </p>
            </div>

        </section>


        <section class="flex w-full items-center justify-center px-6 py-10 md:w-1/2 md:px-10 lg:px-16">

            <div class="w-full max-w-sm">

                <a href="index.html" class="mb-8 inline-block text-lg font-semibold tracking-wide text-[#1E293B] md:hidden">
                    Smart<span class="text-[#2563EB]">Wallet</span>
                </a>

                <!-- Heading -->
                <div class="mb-7">
                    <h1 class="text-3xl font-semibold tracking-tight text-[#1E293B]">
                        Create an account
                    </h1>

                    <p class="mt-2 text-sm text-[#64748B]">
                        Get started with your personal wallet.
                    </p>
                </div>

                <div class="space-y-4">

                    <div>
                        <label for="signupName" class="mb-2 block text-sm font-medium text-[#1E293B]">
                            Full name
                        </label>

                        <input
                            type="text"
                            id="signupName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            class="w-full rounded-lg border border-[#E2E8F0] bg-white px-4 py-3 text-sm text-[#1E293B] outline-none transition placeholder:text-gray-400 focus:border-[#2563EB] focus:ring-2 focus:ring-[#BFDBFE]"
                        >
                    </div>

                    <div>
                        <label for="signupEmail" class="mb-2 block text-sm font-medium text-[#1E293B]">
                            Email address
                        </label>

                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="you@example.com"
                            autocomplete="email"
                            class="w-full rounded-lg border border-[#E2E8F0] bg-white px-4 py-3 text-sm text-[#1E293B] outline-none transition placeholder:text-gray-400 focus:border-[#2563EB] focus:ring-2 focus:ring-[#BFDBFE]"
                        >
                    </div>

                    <div>
                        <label for="signupPassword" class="mb-2 block text-sm font-medium text-[#1E293B]">
                            Password
                        </label>

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="At least 8 characters"
                            autocomplete="new-password"
                            class="w-full rounded-lg border border-[#E2E8F0] bg-white px-4 py-3 text-sm text-[#1E293B] outline-none transition placeholder:text-gray-400 focus:border-[#2563EB] focus:ring-2 focus:ring-[#BFDBFE]"
                        >
                    </div>


                    <p id="signupMessage" class="hidden text-sm" role="alert"></p>

                    <button
                        type="button"
                        id="signupBtn"
                        onclick="signUpUser()"
                        class="w-full rounded-lg bg-[#2563EB] px-4 py-3 text-sm font-medium text-white shadow-sm transition hover:bg-[#1D4ED8] focus:outline-none focus:ring-2 focus:ring-[#2563EB] focus:ring-offset-2 active:scale-[0.99]"
                    >
                        Create Account
                    </button>

                </div>

                <p class="mt-6 text-center text-sm text-[#64748B]">
                    Already have an account?
                    <a href="index.html" class="font-semibold text-[#2563EB] hover:text-[#1D4ED8]">
                        Sign in
                    </a>
                </p>

                <p class="mt-8 text-center text-xs text-gray-400">
                    Spend smarter. Save better.
                </p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
