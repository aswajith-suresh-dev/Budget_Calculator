<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Wallet | Sign In</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="min-h-screen bg-white">
    <main class="flex min-h-screen">
      <section
        class="relative hidden w-1/2 overflow-hidden bg-[#F1F5F9] md:flex md:flex-col md:justify-between md:p-8 lg:p-12"
      >
        <a
          href="index.html"
          class="text-3xl font-semibold  text-[#1E293B]"
        >
          Smart<span class="text-[#2563EB]">Wallet</span>
        </a>

        <div class="flex flex-1 items-center justify-center">
          <img
            src="./Finance app-cuate.svg"
            alt="Smart Wallet illustration"
            class="max-h-[60vh] w-full object-contain"
          />
        </div>

        <div class="max-w-md">
          <h2
            class="text-2xl font-semibold leading-snug text-[#1E293B] lg:text-3xl"
          >
            Your money.<br />
            Your control.
          </h2>

          <p class="mt-3 text-sm leading-6 text-[#64748B]">
            Keep track of your income, manage your expenses, and make smarter
            financial decisions.
          </p>
        </div>
      </section>

      <section
        class="flex w-full items-center justify-center px-6 py-12 md:w-1/2 md:px-10 lg:px-16"
      >
        <div class="w-full max-w-sm">
          <a
            href="index.html"
            class="mb-10 inline-block text-lg font-semibold tracking-wide text-[#1E293B] md:hidden"
          >
            Smart<span class="text-[#2563EB]">Wallet</span>
          </a>

          <div class="mb-8">
            <h1 class="text-3xl font-semibold tracking-tight text-[#1E293B]">
              Welcome back
            </h1>

            <p class="mt-2 text-sm text-[#64748B]">
              Pick up right where you left off.
            </p>
          </div>

          <div class="space-y-5">
            <div>
              <label
                for="email"
                class="mb-2 block text-sm font-medium text-[#1E293B]"
              >
                Email address
              </label>

              <input
                type="email"
                id="email"
                placeholder="you@example.com"
                autocomplete="email"
                class="w-full rounded-lg border border-[#E2E8F0] bg-white px-4 py-3 text-sm text-[#1E293B] outline-none transition placeholder:text-gray-400 focus:border-[#2563EB] focus:ring-2 focus:ring-[#BFDBFE]"
              />
            </div>

            <div>
              <div class="mb-2 flex items-center justify-between">
                <label
                  for="password"
                  class="text-sm font-medium text-[#1E293B]"
                >
                  Password
                </label>
              </div>

              <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                class="w-full rounded-lg border border-[#E2E8F0] bg-white px-4 py-3 text-sm text-[#1E293B] outline-none transition placeholder:text-gray-400 focus:border-[#2563EB] focus:ring-2 focus:ring-[#BFDBFE]"
              />
            </div>

            <p id="message" class="hidden text-sm" role="alert"></p>

            <button
              type="button"
              id="signinBtn"
              onclick="handleSignIn()"
              class="w-full rounded-lg bg-[#2563EB] px-4 py-3 text-sm font-medium text-white shadow-sm transition hover:bg-[#1D4ED8] focus:outline-none focus:ring-2 focus:ring-[#2563EB] focus:ring-offset-2 active:scale-[0.99]"
            >
              Sign In
            </button>
          </div>

          <p class="mt-7 text-center text-sm text-[#64748B]">
            Don't have an account?
            <a
              href="signup.html"
              class="font-semibold text-[#2563EB] hover:text-[#1D4ED8]"
            >
              Create an account
            </a>
          </p>

          <p class="mt-10 text-center text-xs text-gray-400">
            Spend smarter. Save better.
          </p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
